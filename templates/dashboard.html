<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard yes</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Registered Users Dashboard Management</h2>
        <a href="/logout" style="padding: 8px 15px; background: #dc3545; color: white; text-decoration: none; border-radius: 4px;">Logout</a>
    </div>

    <p>Logged in as: <strong>Admin Representative</strong></p>
    
    <button onclick="fetchDatabaseRows()" style="padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; margin-bottom: 20px;">🔄 Refresh Live Data</button>

    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
        <thead>
            <tr style="background-color: #f2f2f2; border-bottom: 2px solid #ddd; text-align: left;">
                <th style="padding: 12px; border: 1px solid #ddd;">Roll Number</th>
                <th style="padding: 12px; border: 1px solid #ddd;">Full Name</th>
                <th style="padding: 12px; border: 1px solid #ddd;">Age</th>
            </tr>
        </thead>
        <tbody id="dataTableBody">
            <!-- Asynchronous rows get injected here -->
        </tbody>
    </table>

    <p id="tableStatus" style="font-style: italic; color: #666; margin-top: 15px;"></p>

    <script>
        async function fetchDatabaseRows() {
            const tableBody = document.getElementById('dataTableBody');
            const status = document.getElementById('tableStatus');
            tableBody.innerHTML = ""; 
            status.innerText = "Querying secure storage layer...";

            try {
                const response = await fetch('/api/admin/users');
                
                if (!response.ok) {
                    throw new Error("Could not access data server layout.");
                }

                const data = await response.json();
                
                if (data.users && data.users.length > 0) {
                    data.users.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="padding: 12px; border: 1px solid #ddd;"><strong>${user.rollno}</strong></td>
                            <td style="padding: 12px; border: 1px solid #ddd;">${user.name}</td>
                            <td style="padding: 12px; border: 1px solid #ddd;">${user.age}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                    status.innerText = `Total users found: ${data.users.length}`;
                } else {
                    tableBody.innerHTML = `<tr><td colspan="3" style="padding:12px; text-align:center;">No users registered yet.</td></tr>`;
                    status.innerText = "";
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "Error: Access denied or lost server response connection.";
            }
        }

        // Run fetch request immediately upon view load execution
        window.onload = fetchDatabaseRows;
    </script>
</body>
</html>
